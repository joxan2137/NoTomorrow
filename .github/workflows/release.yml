name: Release

# Builds the iOS and Android binaries for every published GitHub release and attaches
# them to it. Can also be run by hand (workflow_dispatch): by default that only produces
# artifacts; with `publish` it also creates release v<version> on the commit it runs on,
# as a draft that is published once both builds are attached (a draft left over from a
# failed run is reused on the next one).
#
# Versioning: the release tag (v1.2.3) becomes the version string, the workflow run
# number becomes the build number (CURRENT_PROJECT_VERSION / versionCode).
#
# Signing:
#   iOS      - unsigned .ipa (no Apple team configured). Sideloading tools such as
#              AltStore / Sideloadly re-sign it on install.
#   Android  - signed with the release keystore when these repository secrets exist:
#                ANDROID_KEYSTORE_BASE64   base64 of the .jks / .keystore file
#                ANDROID_KEYSTORE_PASSWORD
#                ANDROID_KEY_ALIAS
#                ANDROID_KEY_PASSWORD
#              otherwise the release build is signed with the debug key.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the binaries (e.g. 1.2.3). Empty = keep project defaults."
        required: false
        type: string
      publish:
        description: "Also create and publish release v<version> on this commit, with the binaries attached."
        required: false
        type: boolean
        default: false
      notes_file:
        description: "Release notes for publish: a Markdown file in the repo. Empty = GitHub's generated notes."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      ios_version: ${{ steps.resolve.outputs.ios_version }}
      label: ${{ steps.resolve.outputs.label }}
      build: ${{ steps.resolve.outputs.build }}
      draft: ${{ steps.resolve.outputs.draft }}
    steps:
      - id: resolve
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          tag="${TAG:-}"
          version="${tag#v}"
          if [ -z "$version" ]; then version="${INPUT_VERSION:-}"; fi
          draft=false
          if [ "${PUBLISH:-}" = "true" ]; then
            if [ -z "$version" ]; then echo "::error title=Publish::publish needs a version"; exit 1; fi
            tag="v$version"
            draft=true
          fi
          if [ -n "$version" ]; then label="$version"; else label="dev-${GITHUB_SHA::7}"; fi
          # CFBundleShortVersionString must be 1-3 dot-separated integers; keep that prefix only.
          ios_version="$(printf '%s' "$version" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || true)"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "ios_version=$ios_version"
            echo "label=$label"
            echo "build=$GITHUB_RUN_NUMBER"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$tag version=$version ios_version=$ios_version label=$label build=$GITHUB_RUN_NUMBER draft=$draft"

      - uses: actions/checkout@v7
        if: steps.resolve.outputs.draft == 'true'

      - name: Create draft release
        if: steps.resolve.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          NOTES_FILE: ${{ inputs.notes_file }}
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft --repo "$GITHUB_REPOSITORY" 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "::error title=Publish::$TAG is already published"
              exit 1
            fi
            echo "Reusing the existing draft of $TAG"
            exit 0
          fi
          notes=(--generate-notes)
          if [ -n "${NOTES_FILE:-}" ]; then notes=(--notes-file "$NOTES_FILE"); fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" "${notes[@]}" --repo "$GITHUB_REPOSITORY"

  ios:
    name: iOS (unsigned IPA)
    needs: meta
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      ARCHIVE_PATH: ${{ github.workspace }}/build/ci/NoTomorrow.xcarchive
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: Archive
        env:
          IOS_VERSION: ${{ needs.meta.outputs.ios_version }}
          BUILD_NUMBER: ${{ needs.meta.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild -version
          overrides=("CURRENT_PROJECT_VERSION=${BUILD_NUMBER}")
          if [ -n "$IOS_VERSION" ]; then overrides+=("MARKETING_VERSION=${IOS_VERSION}"); fi
          xcodebuild archive \
            -project NoTomorrow.xcodeproj \
            -scheme NoTomorrow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath build/ci/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${overrides[@]}" \
            | xcbeautify --renderer github-actions

      - name: Package IPA and dSYMs
        env:
          LABEL: ${{ needs.meta.outputs.label }}
        run: |
          set -euo pipefail
          app="$ARCHIVE_PATH/Products/Applications/NoTomorrow.app"
          test -d "$app"
          stage="$RUNNER_TEMP/ipa"
          mkdir -p "$stage/Payload" dist
          cp -R "$app" "$stage/Payload/"
          # Ad-hoc signature carrying the entitlements: the build itself is unsigned, and sideloading tools
          # (AltStore, SideStore, Sideloadly) read the App Group (widgets) and HealthKit entitlements from the
          # binary when they re-sign it. Nested code first, the app last.
          payload_app="$stage/Payload/NoTomorrow.app"
          if [ -d "$payload_app/Frameworks" ]; then
            find "$payload_app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
              -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - --entitlements NoTomorrowWidgets/NoTomorrowWidgets.entitlements \
            "$payload_app/PlugIns/NoTomorrowWidgets.appex"
          codesign --force --sign - --entitlements NoTomorrow/NoTomorrow.entitlements "$payload_app"
          codesign --display --entitlements - "$payload_app"
          (cd "$stage" && zip -qry "$GITHUB_WORKSPACE/dist/NoTomorrow-${LABEL}-ios-unsigned.ipa" Payload)
          if [ -d "$ARCHIVE_PATH/dSYMs" ]; then
            (cd "$ARCHIVE_PATH" && zip -qry "$GITHUB_WORKSPACE/dist/NoTomorrow-${LABEL}-ios-dSYMs.zip" dSYMs)
          fi
          ls -la dist
          {
            echo "### iOS"
            echo "- Unsigned IPA (re-sign to install): \`NoTomorrow-${LABEL}-ios-unsigned.ipa\`"
            echo "- Version: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist"))"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: needs.meta.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  android:
    name: Android (APK + AAB)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "mode=release keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Android signing::ANDROID_KEYSTORE_BASE64 is not set; the release APK is signed with the debug key."
            echo "mode=debug key (no ANDROID_KEYSTORE_BASE64 secret)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK and AAB
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD_NUMBER: ${{ needs.meta.outputs.build }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=("-PappVersionCode=${BUILD_NUMBER}")
          if [ -n "$VERSION" ]; then args+=("-PappVersionName=${VERSION}"); fi
          ./gradlew :app:assembleRelease :app:bundleRelease "${args[@]}" --stacktrace

      - name: Collect outputs
        env:
          LABEL: ${{ needs.meta.outputs.label }}
          SIGNING_MODE: ${{ steps.keystore.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/NoTomorrow-${LABEL}-android.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/NoTomorrow-${LABEL}-android.aab"
          ls -la "$GITHUB_WORKSPACE/dist"
          {
            echo "### Android"
            echo "- APK: \`NoTomorrow-${LABEL}-android.apk\`"
            echo "- AAB: \`NoTomorrow-${LABEL}-android.aab\`"
            echo "- Signing: ${SIGNING_MODE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: needs.meta.outputs.tag != ''
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish release
    needs: [meta, ios, android]
    if: needs.meta.outputs.draft == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
