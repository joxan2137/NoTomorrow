name: NoTomorrow
options:
  bundleIdPrefix: app.notomorrow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

# UI effects from libraries.dev (MIT), vendored as local Swift packages — see Packages/README.md.
packages:
  ThinkingOrbsKit:
    path: Packages/ThinkingOrbsKit
  BorderBeamKit:
    path: Packages/BorderBeamKit
  MetalFxKit:
    path: Packages/MetalFxKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  NoTomorrow:
    type: application
    platform: iOS
    sources:
      - path: NoTomorrow
        excludes:
          - "Resources/Info.plist"
      - path: Shared
      # The AI prompt/schema/table spec is shared with the backend (and Android); never copy it into the app tree.
      - path: backend/data/ai/estimate-spec.json
        buildPhase: resources
    info:
      path: NoTomorrow/Resources/Info.plist
      properties:
        CFBundleDisplayName: No Tomorrow
        CFBundleName: No Tomorrow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, pl]
        CFBundleDevelopmentRegion: en
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        UIAppFonts:
          - BigShouldersDisplay-ExtraBold.ttf
        NSCameraUsageDescription: "No Tomorrow uses the camera to scan food barcodes and to estimate calories from a photo of your meal."
        NSPhotoLibraryUsageDescription: "No Tomorrow lets you pick a meal photo to estimate its calories."
        NSHealthShareUsageDescription: "No Tomorrow reads your body weight to chart your progress."
        NSHealthUpdateUsageDescription: "No Tomorrow writes the meals and gym sessions you log so they appear in the Health app."
        NSUserNotificationsUsageDescription: "Reminders before your gym session, rest-timer alerts and heads-ups from your gym bro."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: app.notomorrow.deeplink
            CFBundleURLSchemes: [notomorrow]
    entitlements:
      path: NoTomorrow/NoTomorrow.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Shared with the widget extension (docs/widgets.md): the widget snapshot, quick-log queue, rest timer.
        com.apple.security.application-groups: [group.app.notomorrow.ios]
    dependencies:
      - target: NoTomorrowWidgets
        embed: true
      - package: ThinkingOrbsKit
      - package: BorderBeamKit
      - package: MetalFxKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.notomorrow.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        SWIFT_OBJC_BRIDGING_HEADER: ""
    preBuildScripts: []

  NoTomorrowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NoTomorrowWidgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
      # The widgets speak the app's language and use its display face; one catalog and one font file for both targets.
      - path: NoTomorrow/Resources/Localizable.xcstrings
      - path: NoTomorrow/Resources/Fonts
    info:
      path: NoTomorrowWidgets/Info.plist
      properties:
        CFBundleDisplayName: No Tomorrow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, pl]
        CFBundleDevelopmentRegion: en
        UIAppFonts:
          - BigShouldersDisplay-ExtraBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NoTomorrowWidgets/NoTomorrowWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.notomorrow.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.notomorrow.ios.widgets
        SKIP_INSTALL: YES
        # Shared/WidgetIntents.swift runs the Break timer intents through the app when compiled into it.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION

  NoTomorrowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NoTomorrowTests
      # Parity fixtures for the AI finalizer; a folder reference, so new fixtures need no project change.
      - path: backend/data/ai/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: NoTomorrow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.notomorrow.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NoTomorrow:
    build:
      targets:
        NoTomorrow: all
        NoTomorrowWidgets: all
        NoTomorrowTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [NoTomorrowTests]
