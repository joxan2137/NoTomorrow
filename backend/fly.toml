# fly.toml — No Tomorrow API
app = "notomorrow-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "UTC"
  PORT = "8080"
  LOG_LEVEL = "info"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.http_options]
    idle_timeout = 600

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
