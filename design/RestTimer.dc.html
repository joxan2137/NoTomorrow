<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap">
  <style>
    body { margin:0; background:#0A0A0B; color:#F2F2F4; font-family:-apple-system,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:#FF6A2B; } a:hover { color:#FF8A55; }
    .display { font-family:"Big Shoulders Display","Arial Narrow","Helvetica Neue",sans-serif; font-weight:800; letter-spacing:-0.01em; line-height:0.9; }
    .num { font-variant-numeric:tabular-nums; }
    .t2 { font-size:22px; line-height:28px; font-weight:700; letter-spacing:-0.2px; }
    .hl { font-size:17px; line-height:22px; font-weight:600; }
    .body { font-size:17px; line-height:22px; font-weight:400; }
    .sub { font-size:15px; line-height:20px; font-weight:400; }
    .fn { font-size:13px; line-height:18px; font-weight:400; }
    .cap { font-size:12px; line-height:16px; font-weight:500; }
    .eyebrow { font-size:11px; line-height:13px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; }
    .ink2 { color:rgba(235,235,245,0.6); }
    .ink3 { color:rgba(235,235,245,0.42); }
    .ember { color:#FF6A2B; }
    svg { display:block; flex:none; }
  </style>
</helmet>

<div style="width:393px;height:852px;background:#0A0A0B;position:relative;overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box">

  <div style="height:59px;flex:none"></div>

  <!-- header -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:none;height:44px">
    <div style="display:flex;flex-direction:column;gap:2px">
      <span class="eyebrow ember">Rest</span>
      <span class="hl">Push A · 24:16</span>
    </div>
    <div style="width:36px;height:36px;border-radius:18px;background:#2A2A2E;display:flex;align-items:center;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F2F4" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
  </div>

  <!-- ring -->
  <div style="display:flex;align-items:center;justify-content:center;padding:48px 0 0;flex:none">
    <div style="position:relative;width:280px;height:280px">
      <svg width="280" height="280" viewBox="0 0 280 280" style="position:absolute;left:0;top:0">
        <circle cx="140" cy="140" r="128" fill="none" stroke="#1C1C1E" stroke-width="12"></circle>
        <circle cx="140" cy="140" r="128" fill="none" stroke="#FF6A2B" stroke-width="12" stroke-linecap="round" stroke-dasharray="643 804" transform="rotate(-90 140 140)"></circle>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
        <span class="display num" style="font-size:104px;color:#F2F2F4">1:12</span>
        <span class="sub num ink2">of 1:30</span>
      </div>
    </div>
  </div>

  <!-- controls -->
  <div style="display:flex;align-items:center;justify-content:center;gap:16px;padding:40px 20px 0;flex:none">
    <div style="width:64px;height:56px;border-radius:28px;background:#2A2A2E;display:flex;align-items:center;justify-content:center">
      <span class="sub num" style="font-weight:600">−15</span>
    </div>
    <div style="flex:1;height:56px;border-radius:28px;background:#F2F2F4;display:flex;align-items:center;justify-content:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#0A0A0B"><path d="m5 4 10 8-10 8z"></path><rect x="17" y="4" width="2.5" height="16" rx="1"></rect></svg>
      <span class="hl" style="color:#0A0A0B">Skip rest</span>
    </div>
    <div style="width:64px;height:56px;border-radius:28px;background:#2A2A2E;display:flex;align-items:center;justify-content:center">
      <span class="sub num" style="font-weight:600">+15</span>
    </div>
  </div>

  <!-- up next -->
  <div style="margin:40px 20px 0;background:#1C1C1E;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;flex:none">
    <span class="eyebrow ink2">Up next</span>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span class="hl">Bench Press (Barbell)</span>
        <span class="fn ink2">Set 3 of 3 · Best: 85 × 6</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:4px">
        <span class="display num" style="font-size:32px">85</span>
        <span class="fn ink2">kg ×</span>
        <span class="display num" style="font-size:32px">7</span>
      </div>
    </div>
  </div>

  <div style="flex:1"></div>
  <div style="display:flex;align-items:center;justify-content:center;gap:6px;padding:0 0 34px;flex:none">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(235,235,245,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    <span class="fn ink2">Keeps counting on your Lock Screen</span>
  </div>

</div>
</x-dc>
</body>
</html>
