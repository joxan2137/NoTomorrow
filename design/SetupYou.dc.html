<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap">
  <style>
    body { margin:0; background:#0A0A0B; color:#F2F2F4; font-family:-apple-system,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:#FF6A2B; } a:hover { color:#FF8A55; }
    .display { font-family:"Big Shoulders Display","Arial Narrow","Helvetica Neue",sans-serif; font-weight:800; letter-spacing:-0.01em; line-height:0.9; }
    .num { font-variant-numeric:tabular-nums; }
    .t1 { font-size:28px; line-height:34px; font-weight:700; letter-spacing:-0.3px; }
    .t2 { font-size:22px; line-height:28px; font-weight:700; letter-spacing:-0.2px; }
    .hl { font-size:17px; line-height:22px; font-weight:600; }
    .body { font-size:17px; line-height:22px; font-weight:400; }
    .sub { font-size:15px; line-height:20px; font-weight:400; }
    .fn { font-size:13px; line-height:18px; font-weight:400; }
    .cap { font-size:12px; line-height:16px; font-weight:500; }
    .eyebrow { font-size:11px; line-height:13px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; }
    .ink2 { color:rgba(235,235,245,0.6); }
    .ink3 { color:rgba(235,235,245,0.42); }
    .ember { color:#FF6A2B; }
    svg { display:block; flex:none; }
    .field { height:52px; border-radius:14px; background:#1C1C1E; border:1px solid rgba(255,255,255,0.12); display:flex; align-items:center; padding:0 16px; box-sizing:border-box; gap:12px; }
    .chip { height:40px; padding:0 16px; border-radius:20px; background:#1C1C1E; display:flex; align-items:center; justify-content:center; flex:none; }
  </style>
</helmet>

<div style="width:393px;height:852px;background:#0A0A0B;position:relative;overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box">

  <div style="height:59px;flex:none"></div>

  <!-- nav + progress -->
  <div style="display:flex;align-items:center;gap:16px;padding:0 20px;height:44px;flex:none">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2F2F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7M19 12H5"></path></svg>
    <div style="flex:1;display:flex;gap:6px">
      <div style="flex:1;height:4px;border-radius:2px;background:#F2F2F4"></div>
      <div style="flex:1;height:4px;border-radius:2px;background:#2A2A2E"></div>
      <div style="flex:1;height:4px;border-radius:2px;background:#2A2A2E"></div>
    </div>
    <span class="fn num ink2">1 / 3</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px;padding:28px 20px 0;flex:none">
    <span class="t1" style="text-wrap:balance">Who's lifting?</span>
    <span class="sub ink2">Just enough to set your calories. Everything can be changed later in Settings.</span>
  </div>

  <!-- name -->
  <div style="display:flex;flex-direction:column;gap:8px;padding:28px 20px 0;flex:none">
    <span class="eyebrow ink2">Name</span>
    <div class="field"><span class="body" style="flex:1">Kuba</span></div>
  </div>

  <!-- weight -->
  <div style="display:flex;flex-direction:column;gap:8px;padding:18px 20px 0;flex:none">
    <span class="eyebrow ink2">Body weight</span>
    <div style="display:flex;gap:10px">
      <div class="field" style="flex:1;border-color:#F2F2F4;border-width:1.5px"><span class="body num" style="flex:1">82.4</span><span class="sub ink2">kg</span></div>
      <div style="display:flex;background:#1C1C1E;border-radius:14px;padding:3px;width:120px">
        <div style="flex:1;border-radius:11px;background:#38383C;display:flex;align-items:center;justify-content:center"><span class="sub" style="font-weight:600">kg</span></div>
        <div style="flex:1;border-radius:11px;display:flex;align-items:center;justify-content:center"><span class="sub ink2">lb</span></div>
      </div>
    </div>
  </div>

  <!-- goal -->
  <div style="display:flex;flex-direction:column;gap:10px;padding:18px 20px 0;flex:none">
    <span class="eyebrow ink2">Goal</span>
    <div style="display:flex;gap:8px">
      <div class="chip" style="background:#F2F2F4"><span class="sub" style="font-weight:600;color:#0A0A0B">Build muscle</span></div>
      <div class="chip"><span class="sub">Lose fat</span></div>
      <div class="chip"><span class="sub">Maintain</span></div>
    </div>
  </div>

  <!-- suggested target -->
  <div style="margin:22px 20px 0;background:#1C1C1E;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;flex:none">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span class="eyebrow ember">Daily target</span>
      <span class="fn ink2">Edit</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:8px">
      <span class="display num" style="font-size:56px">2,600</span>
      <span class="t2 ink2">kcal</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span class="sub num">180 g protein · 2.2 g per kg</span>
      <span class="fn ink3">Mifflin-St Jeor +300</span>
    </div>
  </div>

  <!-- continue -->
  <div style="position:absolute;left:20px;right:20px;bottom:34px;height:56px;border-radius:28px;background:#F2F2F4;display:flex;align-items:center;justify-content:center">
    <span class="hl" style="color:#0A0A0B">Continue</span>
  </div>

</div>
</x-dc>
</body>
</html>
