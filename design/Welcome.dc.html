<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap">
  <style>
    body { margin:0; background:#0A0A0B; color:#F2F2F4; font-family:-apple-system,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:#FF6A2B; } a:hover { color:#FF8A55; }
    .display { font-family:"Big Shoulders Display","Arial Narrow","Helvetica Neue",sans-serif; font-weight:800; letter-spacing:-0.01em; line-height:0.86; }
    .num { font-variant-numeric:tabular-nums; }
    .t2 { font-size:22px; line-height:28px; font-weight:700; letter-spacing:-0.2px; }
    .hl { font-size:17px; line-height:22px; font-weight:600; }
    .body { font-size:17px; line-height:22px; font-weight:400; }
    .sub { font-size:15px; line-height:20px; font-weight:400; }
    .fn { font-size:13px; line-height:18px; font-weight:400; }
    .cap { font-size:12px; line-height:16px; font-weight:500; }
    .eyebrow { font-size:11px; line-height:13px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; }
    .ink2 { color:rgba(235,235,245,0.6); }
    .ink3 { color:rgba(235,235,245,0.42); }
    .ember { color:#FF6A2B; }
    svg { display:block; flex:none; }
  </style>
</helmet>

<div style="width:393px;height:852px;background:#0A0A0B;position:relative;overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box">

  <div style="height:59px;flex:none"></div>

  <!-- wordmark -->
  <div style="display:flex;flex-direction:column;padding:96px 20px 0;flex:none">
    <span class="display" style="font-size:132px;color:#FF6A2B">NO</span>
    <span class="display" style="font-size:100px;color:#F2F2F4;margin-top:8px">TOMORROW</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;padding:36px 20px 0;flex:none">
    <span class="t2" style="text-wrap:balance">Train today. Track everything.<br>Keep your bro honest.</span>
    <span class="sub ink2">Workouts, calories, progress and a shared schedule with the one guy who'll notice if you skip.</span>
  </div>

  <div style="flex:1"></div>

  <!-- language -->
  <div style="display:flex;flex-direction:column;gap:10px;padding:0 20px;flex:none">
    <span class="eyebrow ink2">Language · Język</span>
    <div style="display:flex;background:#1C1C1E;border-radius:14px;padding:3px">
      <div style="flex:1;height:44px;border-radius:11px;background:#38383C;display:flex;align-items:center;justify-content:center"><span class="sub" style="font-weight:600">English</span></div>
      <div style="flex:1;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center"><span class="sub ink2">Polski</span></div>
    </div>
  </div>

  <!-- actions -->
  <div style="display:flex;flex-direction:column;gap:14px;padding:22px 20px 34px;flex:none">
    <div style="height:56px;border-radius:28px;background:#F2F2F4;display:flex;align-items:center;justify-content:center">
      <span class="hl" style="color:#0A0A0B">Get started</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:6px;height:24px">
      <span class="sub ink2">Got a code from your bro?</span>
      <span class="sub" style="font-weight:600">Pair now</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
