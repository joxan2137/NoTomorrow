<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap">
  <style>
    body { margin:0; background:#0A0A0B; color:#F2F2F4; font-family:-apple-system,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:#FF6A2B; } a:hover { color:#FF8A55; }
    .display { font-family:"Big Shoulders Display","Arial Narrow","Helvetica Neue",sans-serif; font-weight:800; letter-spacing:-0.01em; line-height:0.9; }
    .num { font-variant-numeric:tabular-nums; }
    .t1 { font-size:28px; line-height:34px; font-weight:700; letter-spacing:-0.3px; }
    .hl { font-size:17px; line-height:22px; font-weight:600; }
    .body { font-size:17px; line-height:22px; font-weight:400; }
    .sub { font-size:15px; line-height:20px; font-weight:400; }
    .fn { font-size:13px; line-height:18px; font-weight:400; }
    .cap { font-size:12px; line-height:16px; font-weight:500; }
    .eyebrow { font-size:11px; line-height:13px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; }
    .ink2 { color:rgba(235,235,245,0.6); }
    .ink3 { color:rgba(235,235,245,0.42); }
    .ember { color:#FF6A2B; }
    svg { display:block; flex:none; }
  </style>
</helmet>

<div style="width:393px;height:852px;background:#0A0A0B;position:relative;overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box">

  <div style="height:59px;flex:none"></div>

  <!-- nav + progress -->
  <div style="display:flex;align-items:center;gap:16px;padding:0 20px;height:44px;flex:none">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2F2F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7M19 12H5"></path></svg>
    <div style="flex:1;display:flex;gap:6px">
      <div style="flex:1;height:4px;border-radius:2px;background:#F2F2F4"></div>
      <div style="flex:1;height:4px;border-radius:2px;background:#F2F2F4"></div>
      <div style="flex:1;height:4px;border-radius:2px;background:#F2F2F4"></div>
    </div>
    <span class="fn num ink2">3 / 3</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px;padding:28px 20px 0;flex:none">
    <span class="t1" style="text-wrap:balance">Bring your gym bro</span>
    <span class="sub ink2">One shared schedule. You both see who's in and who bailed.</span>
  </div>

  <!-- avatars -->
  <div style="display:flex;align-items:center;justify-content:center;padding:36px 0 0;flex:none">
    <div style="width:72px;height:72px;border-radius:36px;background:#2A2A2E;border:3px solid #0A0A0B;display:flex;align-items:center;justify-content:center;box-sizing:border-box"><span class="t1">K</span></div>
    <div style="width:72px;height:72px;border-radius:36px;background:#1C1C1E;border:3px solid #0A0A0B;margin-left:-14px;display:flex;align-items:center;justify-content:center;box-sizing:border-box">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(235,235,245,0.42)" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"></path></svg>
    </div>
  </div>

  <!-- your code -->
  <div style="margin:32px 20px 0;background:#1C1C1E;border-radius:22px;padding:20px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;flex:none">
    <span class="eyebrow ink2">Your bro code</span>
    <span class="display num" style="font-size:56px;letter-spacing:0.04em">NT-7K4Q</span>
    <div style="display:flex;gap:10px;width:100%">
      <div style="flex:1;height:48px;border-radius:24px;background:#F2F2F4;display:flex;align-items:center;justify-content:center;gap:8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0A0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"></path></svg>
        <span class="hl" style="color:#0A0A0B">Share code</span>
      </div>
      <div style="width:48px;height:48px;border-radius:24px;background:#2A2A2E;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F2F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      </div>
    </div>
  </div>

  <!-- or -->
  <div style="display:flex;align-items:center;gap:12px;padding:24px 20px 0;flex:none">
    <div style="flex:1;height:1px;background:rgba(255,255,255,0.12)"></div>
    <span class="cap ink2">or enter your bro's code</span>
    <div style="flex:1;height:1px;background:rgba(255,255,255,0.12)"></div>
  </div>

  <div style="display:flex;gap:10px;padding:18px 20px 0;flex:none">
    <div style="flex:1;height:52px;border-radius:14px;background:#1C1C1E;border:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;padding:0 16px;box-sizing:border-box">
      <span class="display" style="font-size:26px;letter-spacing:0.04em;color:rgba(235,235,245,0.42)">NT-____</span>
    </div>
    <div style="height:52px;padding:0 22px;border-radius:14px;background:#2A2A2E;display:flex;align-items:center;justify-content:center">
      <span class="hl ink2">Pair</span>
    </div>
  </div>

  <div style="flex:1"></div>

  <div style="display:flex;flex-direction:column;gap:12px;padding:0 20px 34px;flex:none">
    <span class="fn ink2" style="text-align:center">Tomek shows up in the Bro tab the moment he enters your code.</span>
    <div style="height:56px;border-radius:28px;background:#F2F2F4;display:flex;align-items:center;justify-content:center"><span class="hl" style="color:#0A0A0B">Continue</span></div>
    <div style="display:flex;align-items:center;justify-content:center;height:24px"><span class="sub ink2">Not now · pair later from Bro</span></div>
  </div>

</div>
</x-dc>
</body>
</html>
